name: CI

# One pipeline: every event runs the same checks on that exact commit.
# Release is a later job in the same run — it cannot start unless lint,
# tests, and generate all succeeded. That is the GitHub-native way to
# gate publishing (not a second workflow that races CI).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare isolated test home
        run: mkdir -p "$HOME/.config" "$HOME/AppData/Roaming" "$HOME/AppData/Local"
      - name: Unit tests
        env:
          HOME: ${{ runner.temp }}/msc-test-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/msc-test-home/.config
          APPDATA: ${{ runner.temp }}/msc-test-home/AppData/Roaming
          USERPROFILE: ${{ runner.temp }}/msc-test-home
          LOCALAPPDATA: ${{ runner.temp }}/msc-test-home/AppData/Local
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Coverage summary
        if: runner.os != 'Windows'
        run: go tool cover -func=coverage.out
      - name: Build
        run: go build -o bin/msc${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/msc

  generate:
    name: generate is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate
        run: go generate ./...
      - name: git diff
        run: |
          git add -A
          git diff --cached --exit-code

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
