version: "2"

run:
  timeout: 5m

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - misspell
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
