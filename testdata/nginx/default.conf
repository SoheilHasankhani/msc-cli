# Doctor API server configuration
server {
    listen              443 ssl;
    server_name         doctor.isos.local;

    location / {
        set $doctorupstream         http://doctor;
        # set $doctorupstream         http://host.docker.internal:5010;
        proxy_pass                  $doctorupstream;
    }
}

# Schedule API server configuration
server {
    listen              443 ssl;
    server_name         schedule.isos.local;

    location / {
        set $scheduleupstream       http://host.docker.internal:3000;
        proxy_pass                  $scheduleupstream;
    }
}

# Identity API
server {
    location / {
        set $identity_primary       identity-api:80;
        proxy_pass                  http://$identity_primary;
    }
    location @identity_backup {
        set $identity_backup        host.docker.internal:2000;
        proxy_pass                  http://$identity_backup;
    }
}
